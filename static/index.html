<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eae7f8" />
    <title>Telegram Forwarder · Bot + WebUI</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="glass.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="wash" aria-hidden="true"></div>
    <section id="gate" hidden>
      <div class="gate-sheet">
        <div class="gate-story">
          <div class="brand">
            <span class="logo" aria-hidden="true"
              ><svg viewBox="0 0 32 32">
                <path
                  d="M6 17 18 5l8 0-12 12h8L10 29l4-10H6z"
                  fill="currentColor"
                /></svg
            ></span>
            <div>Telegram频道转发<small>Telegram Forwarder Web</small></div>
          </div>
          <div class="story-copy">
            <h1>频道消息，<br /><em>有序抵达。</em></h1>
            <p>从监听到转发，每一条消息都有迹可循。</p>
          </div>
          <img
            src="prism.svg"
            alt="连接来源与目标频道的玻璃转发节点"
            class="gate-art"
          />
          <div class="gate-foot">
            <span><i></i> Telegram Forwarder Web</span>
          </div>
        </div>
        <div class="gate-form">
          <h2>登录工作台</h2>
          <p>使用部署时设置的管理员密码登录。Telegram 账号在工作台内连接。</p>
          <form id="signin" autocomplete="off">
            <label
              >管理员账号<input
                id="uname"
                required
                maxlength="32"
                value="admin"
                placeholder="管理员账号"
                autocomplete="username" /></label
            ><label for="pwd">登录密码</label>
            <div class="pwd">
              <input
                id="pwd"
                required
                type="password"
                placeholder="请输入管理员密码"
                autocomplete="current-password"
              /><button id="see" type="button" aria-pressed="false">
                显示
              </button>
            </div>
            <div class="login-row">
              <label
                ><input id="keep" type="checkbox" checked />保持登录 12
                小时</label
              ><button type="button" class="link" id="forgot">密码提示</button>
            </div>
            <p role="alert" id="loginerr"></p>
            <button class="btn primary enter" type="submit">
              登录工作台 <span>→</span>
            </button>
          </form>
          <small class="gate-note"
            >账号凭据不保存在页面中。远程登录前请核对 HTTPS 证书。</small
          >
        </div>
      </div>
    </section>
    <div id="workspace" hidden>
      <aside id="side">
        <div class="brand">
          <span class="logo" aria-hidden="true"
            ><svg viewBox="0 0 32 32">
              <path
                d="M6 17 18 5l8 0-12 12h8L10 29l4-10H6z"
                fill="currentColor"
              /></svg
          ></span>
          <div>Telegram频道转发<small>Telegram Forwarder Web</small></div>
        </div>
        <nav id="nav" aria-label="主导航"></nav>
        <div class="sidefoot">
          <span class="light"></span
          ><span>转发引擎<small id="engine">正在连接</small></span
          ><b id="version">—</b>
        </div>
      </aside>
      <div id="shade"></div>
      <div class="shell">
        <header>
          <button id="menu" class="iconbtn mobile" aria-label="打开导航" aria-controls="side" aria-expanded="false">
            ☰
          </button>
          <div class="profile">
            <span class="userbadge" aria-label="管理员">A</span
            ><button id="out" class="link" type="button">退出登录</button>
          </div>
        </header>
        <main>
          <div id="page"></div>
          <footer class="workspace-foot">
            Telegram Forwarder Web
          </footer>
        </main>
      </div>
    </div>
    <dialog id="dlg" aria-labelledby="mt">
      <form id="form">
        <div class="modalhead">
          <div>
            <h2 id="mt"></h2>
          </div>
          <button type="button" id="close" class="iconbtn" aria-label="关闭">
            ×
          </button>
        </div>
        <div id="fields"></div>
        <div class="err" id="error" role="alert"></div>
        <div class="modalfoot">
          <button type="button" id="back" class="btn">关闭</button
          ><button id="submit" class="btn primary">确认</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
