<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f5fa" />
    <title>Telegram Forwarder · Bot + WebUI</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="glass.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <section id="gate" hidden>
      <div class="gate-sheet">
        <div class="gate-story">
          <div class="brand">
            <span class="logo" aria-hidden="true"
              ><svg viewBox="0 0 32 32">
                <path
                  d="M6 17 18 5l8 0-12 12h8L10 29l4-10H6z"
                  fill="currentColor"
                /></svg
            ></span>
            <div>Telegram频道转发<small>Telegram Forwarder Web</small></div>
          </div>
          <img
            src="prism.svg"
            alt="连接来源与目标频道的玻璃转发节点"
            class="gate-art"
          />
          <div class="gate-foot">
            <span><i></i> Telegram Forwarder Web</span>
          </div>
        </div>
        <div class="gate-form">
          <h2>请从 Telegram Bot 打开</h2>
          <p>在管理员私聊里发送 /start，点击「🌐 打开 WebUI」，再打开 Bot 发来的一次性登录链接。</p>
          <p role="alert" id="loginerr"></p>
        </div>
      </div>
    </section>
    <div id="workspace" hidden>
      <aside id="side">
        <div class="brand">
          <span class="logo" aria-hidden="true"
            ><svg viewBox="0 0 32 32">
              <path
                d="M6 17 18 5l8 0-12 12h8L10 29l4-10H6z"
                fill="currentColor"
              /></svg
          ></span>
          <div>Telegram频道转发<small>Telegram Forwarder Web</small></div>
        </div>
        <nav id="nav" aria-label="主导航"></nav>
        <div class="sidefoot">
          <span class="light"></span
          ><span>转发引擎<small id="engine">正在连接</small></span
          ><b id="version">—</b>
        </div>
      </aside>
      <div id="shade"></div>
      <div class="shell">
        <header class="topbar">
          <div class="top-left">
            <button id="menu" class="iconbtn mobile" aria-label="打开导航" aria-controls="side" aria-expanded="false">☰</button>
            <span id="breadcrumb" class="muted"></span>
          </div>
          <div class="profile">
            <button id="theme" class="btn" type="button" aria-pressed="false">深色模式</button>
            <button id="out" class="link" type="button">退出登录</button>
          </div>
        </header>
        <main>
          <div id="page"></div>
          <footer class="workspace-foot">
            Telegram Forwarder Web
          </footer>
        </main>
      </div>
    </div>
    <dialog id="dlg" aria-labelledby="mt">
      <form id="form">
        <div class="modalhead">
          <div>
            <h2 id="mt"></h2>
          </div>
          <button type="button" id="close" class="iconbtn" aria-label="关闭">
            ×
          </button>
        </div>
        <div id="fields"></div>
        <div class="err" id="error" role="alert"></div>
        <div class="modalfoot">
          <button type="button" id="back" class="btn">关闭</button
          ><button id="submit" class="btn primary">确认</button>
        </div>
      </form>
    </dialog>
    <dialog id="media-dialog" aria-labelledby="media-title">
      <div class="modalhead">
        <div><h2 id="media-title"></h2><p id="media-detail" class="muted"></p></div>
        <button id="media-close" type="button" class="btn" autofocus>关闭预览</button>
      </div>
      <div id="media-body"></div>
      <div id="media-controls" class="modalfoot" hidden>
        <div class="actions">
          <button type="button" class="btn" id="media-previous">上一张</button>
          <button type="button" class="btn" id="media-next">下一张</button>
        </div>
        <button type="button" class="btn" id="media-zoom" aria-pressed="false">放大</button>
      </div>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
